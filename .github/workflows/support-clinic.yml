# Robo diario do Support Clinic: exporta o "Relatorio de agendamentos" e manda
# ao CRM (funcao ic-supportclinic). Script: automacao/support-clinic/exportar.py
#
# QUANDO RODA
#   - Manual: aba Actions > "Support Clinic - exportação diária" > Run workflow.
#   - Agendado: so quando a variavel do repositorio SC_AGENDADO = true
#     (Settings > Secrets and variables > Actions > Variables). Sem ela, nada roda
#     sozinho e nada e cobrado.
#   - Uma vez por dia, entre 7h e 9h (Brasilia), em horario sorteado: o GitHub
#     acorda a cada 15 min nessa janela, mas so UM dos 8 horarios do dia e o
#     sorteado (sorteio pelo dia, igual em todas as tentativas). Os outros 7
#     encerram em segundos, sem abrir navegador. No horario sorteado ainda espera
#     de 0 a 4 min a mais, ao acaso.
#
# SEGREDOS (Settings > Secrets and variables > Actions > Secrets)
#   SC_USUARIO, SC_SENHA   usuario dedicado do IC no Support Clinic (so relatorios)
#   SC_IMPORT_TOKEN        o mesmo valor do segredo SC_IMPORT_TOKEN da funcao no Supabase
#
# Se algo falhar, o Fabio recebe aviso no WhatsApp (crm_ia_config.sc_alerta_whatsapp).
name: Support Clinic - exportação diária

on:
  workflow_dispatch:
  schedule:
    # 7h00 a 8h45 de Brasilia (UTC-3). A ordem desta lista e usada no sorteio.
    - cron: "0 10 * * *"
    - cron: "15 10 * * *"
    - cron: "30 10 * * *"
    - cron: "45 10 * * *"
    - cron: "0 11 * * *"
    - cron: "15 11 * * *"
    - cron: "30 11 * * *"
    - cron: "45 11 * * *"

concurrency:
  group: support-clinic
  cancel-in-progress: false

permissions:
  contents: read

env:
  SC_FUNCAO_URL: https://xoppuccjdinafbkxfatg.supabase.co/functions/v1/ic-supportclinic

jobs:
  sorteio:
    if: github.event_name == 'workflow_dispatch' || vars.SC_AGENDADO == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      rodar: ${{ steps.s.outputs.rodar }}
    steps:
      - id: s
        env:
          EVENTO: ${{ github.event_name }}
          AGENDA: ${{ github.event.schedule }}
        run: |
          python3 - <<'PY'
          import datetime as dt, hashlib, os
          horarios = ["0 10 * * *", "15 10 * * *", "30 10 * * *", "45 10 * * *",
                      "0 11 * * *", "15 11 * * *", "30 11 * * *", "45 11 * * *"]
          rotulos = ["7h00", "7h15", "7h30", "7h45", "8h00", "8h15", "8h30", "8h45"]
          dia = (dt.datetime.now(dt.timezone.utc) - dt.timedelta(hours=3)).date().isoformat()
          sorteado = hashlib.sha256(("ic-support-clinic-" + dia).encode()).digest()[0] % len(horarios)
          if os.environ["EVENTO"] == "workflow_dispatch":
              rodar = True
              print("Execução manual.")
          else:
              atual = horarios.index(os.environ["AGENDA"]) if os.environ["AGENDA"] in horarios else -1
              rodar = atual == sorteado
              print(f"Dia {dia}: horário sorteado {rotulos[sorteado]}. Este é o das {rotulos[atual] if atual >= 0 else '?'}: {'roda' if rodar else 'não roda'}.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"rodar={'true' if rodar else 'false'}\n")
          PY

  exportar:
    needs: sorteio
    if: needs.sorteio.outputs.rodar == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: automacao/support-clinic

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar navegador
        run: |
          pip install --quiet playwright==1.49.1 openpyxl==3.1.5
          python -m playwright install --with-deps chromium

      - name: Espera ao acaso
        if: github.event_name == 'schedule'
        run: sleep $(( RANDOM % 240 ))

      - name: Exportar e enviar ao CRM
        id: robo
        env:
          SC_USUARIO: ${{ secrets.SC_USUARIO }}
          SC_SENHA: ${{ secrets.SC_SENHA }}
          SC_IMPORT_TOKEN: ${{ secrets.SC_IMPORT_TOKEN }}
        run: python automacao/support-clinic/exportar.py

      # Falha antes do robo (instalacao, GitHub): o robo nao chegou a avisar.
      - name: Avisar falha
        if: failure() && steps.robo.outcome != 'failure'
        env:
          SC_IMPORT_TOKEN: ${{ secrets.SC_IMPORT_TOKEN }}
        run: |
          curl -sS -X POST "$SC_FUNCAO_URL" \
            -H "Content-Type: application/json" -H "x-sc-token: $SC_IMPORT_TOKEN" \
            -d '{"acao":"falha","etapa":"robo","motivo":"o GitHub não conseguiu preparar o robô (instalação)"}' > /dev/null || true
