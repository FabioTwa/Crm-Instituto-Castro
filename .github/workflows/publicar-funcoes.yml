# Publica as Edge Functions do Supabase (homologacao do IC) quando o codigo delas
# muda na main, ou manualmente (aba Actions > "Publicar funções" > Run workflow).
# Precisa do segredo SUPABASE_ACCESS_TOKEN no repositorio (Settings > Secrets and
# variables > Actions). Antes de publicar, roda os testes; se falharem, nada sai.
name: Publicar funções

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
  workflow_dispatch:
    inputs:
      funcoes:
        description: "Funções a publicar, separadas por espaço (ou 'todas')"
        required: true
        default: "ic-ia-pre-atendimento"

concurrency:
  group: publicar-funcoes
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROJECT_REF: xoppuccjdinafbkxfatg
  # Funcoes chamadas sem login (webhook da Z-API, varredor, chamadas internas):
  # publicadas com --no-verify-jwt. As demais exigem login (verify_jwt ligado).
  SEM_JWT: "ic-ia-pre-atendimento ic-meta-webhook ic-agendamento ic-supportclinic"

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Escolher funções
        id: escolha
        env:
          ENTRADA: ${{ github.event.inputs.funcoes }}
          ANTES: ${{ github.event.before }}
        run: |
          set -euo pipefail
          todas=$(ls -d supabase/functions/*/ | xargs -n1 basename | grep -v '^_' | tr '\n' ' ')
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ "${ENTRADA}" = "todas" ]; then lista="$todas"; else lista="${ENTRADA}"; fi
            for fn in $lista; do
              if ! echo " $todas " | grep -q " $fn "; then echo "Função desconhecida: $fn"; exit 1; fi
            done
          else
            if [ -z "${ANTES}" ] || [ "${ANTES}" = "0000000000000000000000000000000000000000" ]; then
              git diff --name-only HEAD~1 HEAD > /tmp/alterados.txt
            else
              git diff --name-only "${ANTES}" "${GITHUB_SHA}" > /tmp/alterados.txt
            fi
            lista=$(python3 .github/scripts/funcoes_afetadas.py /tmp/alterados.txt | tr '\n' ' ')
          fi
          echo "Funções: ${lista:-nenhuma}"
          echo "lista=${lista}" >> "$GITHUB_OUTPUT"

      - uses: denoland/setup-deno@v2
        if: steps.escolha.outputs.lista != ''
        with:
          deno-version: v2.x

      - name: Testes
        if: steps.escolha.outputs.lista != ''
        run: deno test -A --no-check supabase/functions

      - uses: supabase/setup-cli@v1
        if: steps.escolha.outputs.lista != ''
        with:
          version: latest

      - name: Publicar
        if: steps.escolha.outputs.lista != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          LISTA: ${{ steps.escolha.outputs.lista }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "Falta o segredo SUPABASE_ACCESS_TOKEN no repositório."; exit 1
          fi
          for fn in ${LISTA}; do
            flag=""
            if echo " ${SEM_JWT} " | grep -q " $fn "; then flag="--no-verify-jwt"; fi
            echo "::group::Publicando $fn $flag"
            supabase functions deploy "$fn" $flag --project-ref "${PROJECT_REF}"
            echo "::endgroup::"
          done
